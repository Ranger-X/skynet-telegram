{{- $_ := set $ "ImageName" "skynet" }}

project: {{ $.ImageName }}
configVersion: 1
build:
  imageSpec:
    clearHistory: true
    config:
      clearWerfLabels: true
      keepEssentialWerfLabels: true
      removeLabels:
        - /.*/

---
image: {{ $.ImageName }}
final: true
from: python:3.14-slim
git:
  - add: /
    to: /app
    owner: 1000
    group: 1000
    stageDependencies:
      install:
        - "requirements.txt"
      setup:
        - "**/*"
shell:
  beforeInstall:
    # Install apt packages required for building Python dependencies
    - apt-get update && apt-get install -y --no-install-recommends build-essential libxml2-dev libxslt1-dev libffi-dev && rm -rf /var/lib/apt/lists/*
    - useradd -m -u 1000 -s /bin/bash appuser
    # Install uv
    - pip install uv
  install:
    - uv venv /app/.venv
    - export PATH="/app/.venv/bin:$PATH"
    - cd /app
    # Install Python dependencies from requirements.txt
    - uv pip install -r requirements.txt
  setup:
    # Set working directory
    - cd /app
imageSpec:
  config:
    entrypoint: ["uv", "run", "main.py"]
    user: 1000:1000
    workingDir: /app